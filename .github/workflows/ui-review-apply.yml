name: Apply UI review

on:
  push:
    branches:
      - codex/ui-chrome-review
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ui-chrome-review
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Apply reviewed UI changes
        run: |
          if grep -q 'Keyboard Reference' src/app.ts; then
            echo "UI patch already applied"
            rm -f .ui-review-error.log
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply-ui-review.py")
          source = path.read_text()
          source = source.replace(
              "app = replace_once(app,\n    '''  private async help(): Promise<void> {",
              "app = replace_once(app,\n    r'''  private async help(): Promise<void> {",
              1,
          )
          source = source.replace(
              "  }''',\n    '''  private async help(): Promise<void> {",
              "  }''',\n    r'''  private async help(): Promise<void> {",
              1,
          )
          path.write_text(source)
          PY
          set +e
          python3 scripts/apply-ui-review.py > .ui-review-error.log 2>&1
          status=$?
          cat .ui-review-error.log
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .ui-review-error.log
            git commit -m "chore: capture UI patch failure"
            git push
            exit "$status"
          fi
          rm -f .ui-review-error.log
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type-check
        run: bunx tsc --noEmit
      - name: Test
        run: |
          set +e
          bun test > .ui-review-test.log 2>&1
          status=$?
          cat .ui-review-test.log
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src test .ui-review-test.log
            git commit -m "chore: capture UI test failure"
            git push
            exit "$status"
          fi
          rm .ui-review-test.log
      - name: Commit verified changes
        run: |
          rm scripts/apply-ui-review.py .github/workflows/ui-review-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish TUI interaction chrome"
          git push
