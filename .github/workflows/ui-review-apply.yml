name: Apply UI review

on:
  push:
    branches:
      - codex/ui-chrome-review
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ui-chrome-review
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Refine responsive UI hints
        run: |
          rm -f .ui-review-error.log .ui-review-test.log
          python3 scripts/refine-ui-review.py
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type-check
        run: bunx tsc --noEmit
      - name: Test
        run: |
          set +e
          bun test > .ui-review-test.log 2>&1
          status=$?
          cat .ui-review-test.log
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src test .ui-review-test.log
            git commit -m "chore: capture UI test failure"
            git push
            exit "$status"
          fi
          rm .ui-review-test.log
      - name: Commit verified changes
        run: |
          rm scripts/apply-ui-review.py scripts/refine-ui-review.py .github/workflows/ui-review-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish TUI interaction chrome"
          git push
