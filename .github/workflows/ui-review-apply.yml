name: Apply UI review

on:
  push:
    branches:
      - codex/ui-chrome-review
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ui-chrome-review
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Apply reviewed UI changes
        run: |
          if ! grep -q 'Keyboard Reference' src/app.ts; then
            python3 - <<'PY'
            from pathlib import Path
            path = Path("scripts/apply-ui-review.py")
            source = path.read_text()
            source = source.replace(
                "app = replace_once(app,\n    '''  private async help(): Promise<void> {",
                "app = replace_once(app,\n    r'''  private async help(): Promise<void> {",
                1,
            )
            source = source.replace(
                "  }''',\n    '''  private async help(): Promise<void> {",
                "  }''',\n    r'''  private async help(): Promise<void> {",
                1,
            )
            path.write_text(source)
            PY
            python3 scripts/apply-ui-review.py
          fi
          rm -f .ui-review-error.log .ui-review-test.log
          python3 - <<'PY'
          from pathlib import Path

          dialogs_path = Path("src/tui/dialogs.ts")
          dialogs = dialogs_path.read_text()
          dialogs = dialogs.replace("Math.max(3, maxHeight - 10)", "Math.max(3, maxHeight - 11)", 1)
          dialogs = dialogs.replace("this.modalBox(renderer, title, textHeight + 10)", "this.modalBox(renderer, title, textHeight + 11)", 1)
          dialogs = dialogs.replace(
              '''    modal.add(this.shortcutBar(renderer, [
              { key: "←/→", label: "choose" },
              { key: "Enter", label: "activate" },
              { key: "Y", label: "confirm" },
              { key: "N/Esc", label: "cancel" },
            ]));''',
              '''    modal.add(this.shortcutBar(renderer, [
              { key: "←/→", label: "choose" },
              { key: "Enter", label: "activate" },
            ]));
            modal.add(this.shortcutBar(renderer, [
              { key: "Y", label: "confirm" },
              { key: "N/Esc", label: "cancel" },
            ]));''',
              1,
          )
          dialogs = dialogs.replace(
              "textHeight + 10, (height) => { body.height = Math.max(1, height - 10); }",
              "textHeight + 11, (height) => { body.height = Math.max(1, height - 11); }",
              1,
          )
          dialogs_path.write_text(dialogs)

          app_path = Path("src/app.ts")
          app = app_path.read_text()
          app = app.replace('case "files-panel": return " [Enter] open  [Space] choose  [Backspace] up ";', 'case "files-panel": return " [Enter] open ";', 1)
          app = app.replace('case "chip-panel": return " [Enter] choose  [/] search  [I] details ";', 'case "chip-panel": return " [Enter] choose ";', 1)
          app = app.replace('case "log-panel": return " [↑/↓] scroll  [L] focus ";', 'case "log-panel": return " [↑/↓] scroll ";', 1)
          app_path.write_text(app)
          PY
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type-check
        run: bunx tsc --noEmit
      - name: Test
        run: bun test
      - name: Commit verified changes
        run: |
          rm scripts/apply-ui-review.py .github/workflows/ui-review-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish TUI interaction chrome"
          git push
