name: Windows UI debug

on:
  push:
    branches:
      - codex/ui-chrome-review

permissions:
  contents: write

jobs:
  windows-ui-tests:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ui-chrome-review
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Capture Windows test output
        shell: pwsh
        run: |
          bun test *>&1 | Tee-Object -FilePath .windows-test.log
          $status = $LASTEXITCODE
          if ($status -ne 0) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .windows-test.log
            git commit -m "chore: capture Windows UI test failure"
            git push
            exit $status
          }
          Remove-Item .windows-test.log
          Remove-Item .github/workflows/windows-ui-debug.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove Windows UI debug workflow"
          git push
