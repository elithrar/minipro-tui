name: Apply search focus fix

on:
  push:
    branches:
      - codex/ui-chrome-review
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ui-chrome-review
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Apply focus interaction changes
        run: |
          python3 scripts/apply-search-focus-fix.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/app.ts")
          source = path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected 1 match, found {count}")
              source = source.replace(old, new, 1)

          replace_once(
              '        if (key.name === "escape" || key.name === "esc") {\n          consumeKey(key);\n          this.exitSearchInput();',
              '        if (isEscapeKey(key)) {\n          consumeKey(key);\n          this.exitSearchInput();',
              'global Escape handling',
          )

          key_handler = (
              '    fileQuery.onKeyDown = (key) => {\n'
              '      if (isEscapeKey(key)) {\n'
              '        consumeKey(key);\n'
              '        this.exitSearchInput();\n'
              '      }\n'
              '    };\n'
          )
          replace_once(
              '    });\n    const files = new SelectRenderable',
              '    });\n' + key_handler + '    const files = new SelectRenderable',
              'file search key handler',
          )

          chip_handler = (
              '    chipQuery.onKeyDown = (key) => {\n'
              '      if (isEscapeKey(key)) {\n'
              '        consumeKey(key);\n'
              '        this.exitSearchInput();\n'
              '      }\n'
              '    };\n'
          )
          replace_once(
              '    });\n    const chips = new SelectRenderable',
              '    });\n' + chip_handler + '    const chips = new SelectRenderable',
              'EPROM search key handler',
          )

          replace_once(
              '    if (components.fileQuery.focused) {\n      components.files.focus();',
              '    if (components.fileQuery.focused) {\n      components.fileQuery.blur();\n      components.files.focus();',
              'file search blur',
          )
          replace_once(
              '      components.chipQuery.value = this.chipQuery;\n      components.chips.focus();',
              '      components.chipQuery.value = this.chipQuery;\n      components.chipQuery.blur();\n      components.chips.focus();',
              'EPROM search blur',
          )
          replace_once(
              '    if (activeSearch === "chips") components.chipQuery.value = this.chipQuery;\n    if (pointInRenderable(components.filesPanel, x, y))',
              '    if (activeSearch === "files") components.fileQuery.blur();\n    else {\n      components.chipQuery.value = this.chipQuery;\n      components.chipQuery.blur();\n    }\n    if (pointInRenderable(components.filesPanel, x, y))',
              'pointer search blur',
          )
          replace_once(
              'function consumeKey(key: KeyEvent): void {',
              'function isEscapeKey(key: KeyEvent): boolean {\n  return key.name === "escape" || key.name === "esc" || key.raw === "\\x1b" || key.sequence === "\\x1b";\n}\n\nfunction consumeKey(key: KeyEvent): void {',
              'Escape key helper',
          )
          path.write_text(source)
          PY
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - name: Test and capture failure
        run: |
          set +e
          bun test > .search-focus-test.log 2>&1
          status=$?
          cat .search-focus-test.log
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .search-focus-test.log
            git commit -m "chore: capture search focus test failure"
            git push
            exit "$status"
          fi
          rm .search-focus-test.log
      - run: bun run build
      - name: Commit verified changes
        run: |
          rm -f .search-focus-error.log .search-focus-test.log scripts/apply-search-focus-fix.py .github/workflows/search-focus-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix search input focus capture"
          git push
