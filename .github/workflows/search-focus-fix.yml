name: Apply search focus fix

on:
  push:
    branches:
      - codex/ui-chrome-review

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ui-chrome-review
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Apply focus interaction changes
        run: |
          set +e
          python3 scripts/apply-search-focus-fix.py > .search-focus-error.log 2>&1
          status=$?
          cat .search-focus-error.log
          if [ "$status" -ne 0 ]; then
            rm -f scripts/apply-search-focus-fix.py .github/workflows/search-focus-fix.yml
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: capture search focus patch failure"
            git push
            exit "$status"
          fi
          rm .search-focus-error.log
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test
      - run: bun run build
      - name: Commit verified changes
        run: |
          rm scripts/apply-search-focus-fix.py .github/workflows/search-focus-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix search input focus capture"
          git push
