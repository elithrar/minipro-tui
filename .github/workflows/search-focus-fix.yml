name: Apply search focus fix

on:
  push:
    branches:
      - codex/ui-chrome-review
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ui-chrome-review
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Apply focus interaction changes
        run: |
          python3 scripts/apply-search-focus-fix.py
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - name: Test and capture failure
        run: |
          set +e
          bun test > .search-focus-test.log 2>&1
          status=$?
          cat .search-focus-test.log
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .search-focus-test.log
            git commit -m "chore: capture search focus test failure"
            git push
            exit "$status"
          fi
          rm .search-focus-test.log
      - run: bun run build
      - name: Commit verified changes
        run: |
          rm -f .search-focus-error.log .search-focus-test.log scripts/apply-search-focus-fix.py .github/workflows/search-focus-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix search input focus capture"
          git push
